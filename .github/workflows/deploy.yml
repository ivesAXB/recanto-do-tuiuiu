# Publishes the site to GitHub Pages on every push to main (and manually from the Actions tab).
# Setup steps and the variable names to create are in README.md ("Publicação").
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Minimum permissions needed by the official Pages actions
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; a newer push cancels nothing that is already publishing
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint

      # base_path is "/recanto-do-tuiuiu" on the github.io test address and "" once a custom domain is set
      - id: pages
        uses: actions/configure-pages@v5

      # Public values only (project URL, publishable/anon key, WhatsApp). Never the service_role/secret key.
      - name: Check required variables
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_WHATSAPP_NUMBER: ${{ vars.VITE_WHATSAPP_NUMBER }}
        run: |
          missing=0
          for name in VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY VITE_WHATSAPP_NUMBER; do
            if [ -z "${!name}" ]; then echo "::error::Falta $name (ver README, seção Publicação)"; missing=1; fi
          done
          exit $missing

      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_WHATSAPP_NUMBER: ${{ vars.VITE_WHATSAPP_NUMBER }}
          # Optional: with it, the form uses the captcha + Edge Function; without it, the direct RPC
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
          VITE_BASE: ${{ steps.pages.outputs.base_path }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
