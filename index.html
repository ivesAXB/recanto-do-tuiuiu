<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recanto do Tuiuiú | Pesca e Ecoturismo no Pantanal</title>
    <meta
      name="description"
      content="Pousada no Pantanal mato-grossense: pesca esportiva de Dourado, Pintado e Pacu, ecoturismo e hospedagem com café, almoço e janta. Peça sua reserva sem cadastro."
    />
    <meta name="theme-color" content="#14261f" />

    <!-- Open Graph (WhatsApp, Facebook, Instagram) and Twitter/X previews.
         __SITE_URL__ is replaced at build time (vite.config.ts) with the absolute site address. -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="Pousada Recanto do Tuiuiú" />
    <meta property="og:title" content="Recanto do Tuiuiú | Pesca e Ecoturismo no Pantanal" />
    <meta
      property="og:description"
      content="Pesca esportiva, ecoturismo e hospedagem com pensão completa no Pantanal mato-grossense. Peça sua reserva sem cadastro."
    />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:image" content="__SITE_URL__/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Casal de tuiuiús de asas abertas no Pantanal" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Structured data: only facts confirmed in CLAUDE.md (address, phone and prices are pending) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LodgingBusiness",
        "name": "Pousada Recanto do Tuiuiú",
        "description": "Pousada no Pantanal mato-grossense com pesca esportiva, ecoturismo e hospedagem com café, almoço e janta inclusos.",
        "url": "__SITE_URL__/",
        "image": "__SITE_URL__/og-image.jpg",
        "address": {
          "@type": "PostalAddress",
          "addressRegion": "MT",
          "addressCountry": "BR"
        },
        "maximumAttendeeCapacity": 18,
        "amenityFeature": [
          { "@type": "LocationFeatureSpecification", "name": "Café, almoço e janta inclusos", "value": true },
          { "@type": "LocationFeatureSpecification", "name": "Pesca esportiva", "value": true },
          { "@type": "LocationFeatureSpecification", "name": "Passeio ecológico de barco", "value": true }
        ]
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
